const RARITY_WEIGHT = { common: 1, uncommon: 2, rare: 4, very_rare: 7, legendary: 12 };

/* Sanity-checks the static config (ITEMS/SECTOR_LOOT_PROFILES/CONTRACT_
   TEMPLATES) at startup. Logs every violation found rather than throwing —
   a config bug shouldn't take down the whole page for whoever's playing. */
function validateConfigs() {
  const errors = [];

  Object.entries(SECTOR_LOOT_PROFILES).forEach(([loc, profile]) => {
    if (!(profile.specialChance >= 0 && profile.specialChance <= 1)) {
      errors.push('SECTOR_LOOT_PROFILES.' + loc + '.specialChance out of 0..1: ' + profile.specialChance);
    }
    if (profile.specialChanceDeep != null && !(profile.specialChanceDeep >= 0 && profile.specialChanceDeep <= 1)) {
      errors.push('SECTOR_LOOT_PROFILES.' + loc + '.specialChanceDeep out of 0..1: ' + profile.specialChanceDeep);
    }
    const act = ACTIVITIES.find(a => a.location === loc);
    profile.channels.forEach(ch => {
      if (!(ch.weight > 0)) errors.push('SECTOR_LOOT_PROFILES.' + loc + ' channel "' + ch.role + '" has non-positive weight');
      if (act && !ITEMS.some(i => i.role === ch.role && i.activities.includes(act.id))) {
        errors.push('SECTOR_LOOT_PROFILES.' + loc + ' references role "' + ch.role + '" with no matching item');
      }
    });
  });

  const baseChances = new Set(Object.values(SECTOR_LOOT_PROFILES).map(p => p.specialChance));
  if (baseChances.size > 1) {
    errors.push('SECTOR_LOOT_PROFILES.specialChance is not equalized across sectors: ' + [...baseChances].join(', '));
  }

  CONTRACT_TEMPLATES.forEach(t => {
    t.requires.forEach(r => {
      const item = byId(r.itemId);
      if (!item) { errors.push('CONTRACT_TEMPLATES.' + t.id + ' requires unknown item "' + r.itemId + '"'); return; }
      if (!item.consumable) errors.push('CONTRACT_TEMPLATES.' + t.id + ' requires non-consumable item "' + r.itemId + '"');
    });
  });

  GEAR_SLOTS.forEach(slot => {
    if (!ITEMS.some(i => i.type === 'gear' && i.slot === slot)) errors.push('No gear item covers slot "' + slot + '"');
  });

  DEEP_SECTORS.forEach(sec => {
    // платный вход обязан быть гарантированным: иначе пропуск сгорает впустую,
    // и это единственный способ, которым проект может наказать
    if (sec.passItemId && sec.profile.specialChance !== 1) {
      errors.push('DEEP_SECTORS.' + sec.id + ': вход платный, а specialChance != 1 (' + sec.profile.specialChance + ')');
    }
    const pass = sec.passItemId && byId(sec.passItemId);
    if (sec.passItemId && !pass) errors.push('DEEP_SECTORS.' + sec.id + ': пропуск "' + sec.passItemId + '" не найден в ITEMS');
    if (pass) {
      if (pass.type === 'artifact') errors.push('DEEP_SECTORS.' + sec.id + ': пропуск не может быть артефактом');
      if (!pass.consumable) errors.push('DEEP_SECTORS.' + sec.id + ': пропуск не расходуемый');
      if (pass.unique) errors.push('DEEP_SECTORS.' + sec.id + ': пропуск должен быть повторяемым');
      if (CONTRACT_TEMPLATES.some(t => t.requires.some(r => r.itemId === pass.id))) {
        errors.push('DEEP_SECTORS.' + sec.id + ': пропуск требуется контрактом — документ превращается в валюту');
      }
    }
    (sec.requirements.requiredItemIds || []).forEach(id => {
      if (!byId(id)) errors.push('DEEP_SECTORS.' + sec.id + ': требует несуществующий предмет "' + id + '"');
    });
    const pool = ITEMS.filter(i => (i.sectors || []).includes(sec.id));
    sec.profile.channels.forEach(ch => {
      if (!(ch.weight > 0)) errors.push('DEEP_SECTORS.' + sec.id + ' channel "' + ch.role + '" has non-positive weight');
      if (!pool.some(i => i.role === ch.role)) {
        errors.push('DEEP_SECTORS.' + sec.id + ' references role "' + ch.role + '" with no matching item');
      }
    });
    // тот же инвариант, что в базе, но здесь вырождение пула стоит пропуска
    if (!pool.some(i => !i.unique)) {
      errors.push('DEEP_SECTORS.' + sec.id + ': в пуле нет ни одного повторяемого предмета — платный вход выродится');
    }
  });

  // предмет глубины не должен встречаться в базовых пулах: иначе у сектора
  // пропадает «адрес», ради которого туда ходят
  ITEMS.forEach(i => {
    if ((i.sectors || []).length && i.activities.length) {
      errors.push('ITEMS.' + i.id + ': предмет глубины протекает в базовые пулы (activities не пустой)');
    }
  });

  if (errors.length) errors.forEach(e => console.error('[config validation]', e));
  return errors;
}

/* ── STORAGE ─────────────────────────────────────────────────────────────── */
const KEY = 'raidlog_v1';
const APP_VERSION = '0.2.5';
const DEV_MODE_KEY = 'raidlog_devmode_v1';
const DEV_UNGATE_KEY = 'raidlog_dev_ungate_v1';

function emptyDB() {
  return {
    schemaVersion: 3,
    sessions: [],
    inventory: {},
    discoveries: {},
    gear: {
      owned: [],
      appearance: {
        head: null, face: null, body: null, legs: null,
        hands: null, rig: null, backpack: null, weapon: null,
        artifactSlots: [null, null],
      },
    },
    displayedItems: [],   // itemIds actually placed on the showcase — capacity
                           // (base 1, +1 at level 3, +1 per combo reward
                           // earned) is computed by displayCapacity(), not
                           // stored as padding
    bonusDisplaySlots: 0, // combo-earned capacity only; the base slot and the
                           // level-3 slot are derived from level(), not stored
    contracts: { active: [], completed: [], lastGeneratedLocalDate: null },
    achievements: { unlocked: {} },
    unlockedSectors: [],
    settings: {},
    devGrants: [],   // items handed out via the dev panel, kept separate from
                      // sessions specifically so they carry no XP; tracked here
                      // (not in a dev-only localStorage key) purely so ОЧИСТИТЬ
                      // DEV-СЛЕДЫ can find and reverse them after a reload
  };
}

/* v1 sessions are the only history we have; rebuild inventory/gear from their
   drops so nothing found before the schema change is lost (discoveries gets
   rebuilt properly by upgradeDiscoveriesToV3 right after this, so a rough
   shape here is fine). Item ids from v1 all still resolve in ITEMS (later
   versions only add items, never remove), so a plain lookup is enough — no id
   remapping table needed. */
function migrateV1toV2(old) {
  const db = emptyDB();
  db.sessions = Array.isArray(old.sessions) ? old.sessions : [];
  db.sessions.forEach(sess => {
    (sess.drops || []).forEach(d => {
      const item = ITEMS.find(i => i.id === d.itemId);
      if (!item) return;
      if (item.type === 'material') {
        db.inventory[item.id] = (db.inventory[item.id] || 0) + 1;
      } else if (item.type === 'gear' && !db.gear.owned.includes(item.id)) {
        db.gear.owned.push(item.id);
      }
    });
  });
  if (old.achievements && old.achievements.unlocked && typeof old.achievements.unlocked === 'object') {
    db.achievements.unlocked = old.achievements.unlocked;
  }
  return db;
}

/* v2 discoveries were {date, source} or {date, source, firstSource:{kind,
   activityId}} depending on how old the save is; v3 is richer (firstFoundAt +
   firstLocalDate instead of one ambiguous date, firstSource.id, totalFound)
   and now exists for materials too — inventory stays the current stock,
   discoveries becomes the historical record, and those answer genuinely
   different questions (a contract can spend material stock down to zero
   without erasing the fact it was once found).
   Rather than translate the old shape field-by-field, this replays every
   known source of drops — sessions, contract rewards (via looked-up
   template, since old completed-contract records didn't store grantedItems
   yet), dev grants — in chronological order and rebuilds discoveries from
   scratch. That's also what naturally fixes stamped_bearing/registrar_seal/
   catalog_card: they were type:collectible (discoveries-only) before the
   previous commit reclassified them to type:material; any copy already
   found under the old type is backfilled into inventory here too, since
   nothing could have consumed them yet — no template ever required them. */
function upgradeDiscoveriesToV3(db) {
  const events = [];

  db.sessions.forEach(sess => {
    (sess.drops || []).forEach(d => {
      events.push({
        itemId: d.itemId, at: sess.completedAt, localDate: sess.localDate,
        kind: sess.source === 'dev' ? 'dev' : 'sortie', id: sess.id, activityId: sess.activityId,
      });
    });
  });

  ((db.contracts && db.contracts.completed) || []).forEach(c => {
    const tpl = CONTRACT_TEMPLATES.find(t => t.id === c.templateId);
    const granted = Array.isArray(c.grantedItems) ? c.grantedItems
      : (tpl ? (tpl.reward.items || []).flatMap(ri => Array(ri.qty).fill(ri.itemId)) : []);
    const at = c.completedAt || new Date().toISOString();
    granted.forEach(itemId => {
      events.push({ itemId, at, localDate: c.localDate || localDate(new Date(at)), kind: 'contract', id: c.id, activityId: undefined });
    });
  });

  (db.devGrants || []).forEach(g => {
    const at = g.at || new Date().toISOString();
    events.push({ itemId: g.itemId, at, localDate: localDate(new Date(at)), kind: 'dev', id: null, activityId: undefined });
  });

  events.sort((a, b) => (a.at || '').localeCompare(b.at || ''));

  db.discoveries = {};
  events.forEach(ev => {
    const item = ITEMS.find(i => i.id === ev.itemId);
    if (!item) return;
    let disc = db.discoveries[ev.itemId];
    if (!disc) {
      disc = db.discoveries[ev.itemId] = {
        firstFoundAt: ev.at || new Date().toISOString(),
        firstLocalDate: ev.localDate || localDate(),
        firstSource: { kind: ev.kind, id: ev.id, activityId: ev.activityId },
        totalFound: 0,
      };
    }
    if (!item.unique || disc.totalFound === 0) disc.totalFound += 1;
  });

  // this runs before normalizeDB (see coerceToV3), so a save missing a key
  // entirely must not throw here — a TypeError escapes load() uncaught and
  // takes the whole page down instead of just that save
  if (!db.inventory || typeof db.inventory !== 'object') db.inventory = {};

  const RECLASSIFIED_TO_MATERIAL = ['stamped_bearing', 'registrar_seal', 'catalog_card'];
  RECLASSIFIED_TO_MATERIAL.forEach(id => {
    const disc = db.discoveries[id];
    if (disc && disc.totalFound > 0 && !(db.inventory[id] > 0)) db.inventory[id] = disc.totalFound;
  });

  return db;
}

/* fills in any keys a saved/imported v3 DB is missing — covers partial saves
   from earlier in development and keeps future additive schema tweaks safe */
function normalizeDB(d) {
  const empty = emptyDB();
  d.schemaVersion = 3;
  d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  d.inventory = (d.inventory && typeof d.inventory === 'object') ? d.inventory : {};
  d.discoveries = (d.discoveries && typeof d.discoveries === 'object') ? d.discoveries : {};
  d.gear = (d.gear && typeof d.gear === 'object') ? d.gear : empty.gear;
  d.gear.owned = Array.isArray(d.gear.owned) ? d.gear.owned : [];
  d.gear.appearance = Object.assign({}, empty.gear.appearance, d.gear.appearance || {});
  if (!Array.isArray(d.gear.appearance.artifactSlots)) d.gear.appearance.artifactSlots = [null, null];
  if (Array.isArray(d.displaySlots)) {
    // old fixed-length [null,null]+combo-push shape -> computed capacity model:
    // any real (non-null) entries carry over, growth beyond the old base of 2
    // becomes bonusDisplaySlots (the base slot and the level-3 slot are
    // derived now, not stored, so only combo-earned growth needs preserving)
    d.displayedItems = d.displaySlots.filter(x => x != null);
    d.bonusDisplaySlots = Math.max(0, d.displaySlots.length - 2);
    delete d.displaySlots;
  }
  d.displayedItems = Array.isArray(d.displayedItems) ? d.displayedItems : [];
  d.bonusDisplaySlots = typeof d.bonusDisplaySlots === 'number' ? d.bonusDisplaySlots : 0;
  d.contracts = (d.contracts && typeof d.contracts === 'object') ? d.contracts : empty.contracts;
  d.contracts.active = Array.isArray(d.contracts.active) ? d.contracts.active : [];
  d.contracts.completed = Array.isArray(d.contracts.completed) ? d.contracts.completed : [];
  d.contracts.lastGeneratedLocalDate = d.contracts.lastGeneratedLocalDate || null;
  d.achievements = (d.achievements && typeof d.achievements === 'object') ? d.achievements : { unlocked: {} };
  d.achievements.unlocked = (d.achievements.unlocked && typeof d.achievements.unlocked === 'object') ? d.achievements.unlocked : {};
  d.unlockedSectors = Array.isArray(d.unlockedSectors) ? d.unlockedSectors : [];
  d.settings = (d.settings && typeof d.settings === 'object') ? d.settings : {};
  d.devGrants = Array.isArray(d.devGrants) ? d.devGrants : [];
  return d;
}

/* accepts a parsed v1/v2/v3 save (used by both load() and file import) and
   always returns a normalized v3 DB. The discoveries rebuild only ever runs
   as part of the v1/v2 -> v3 transition, once — ongoing play maintains
   discoveries incrementally via applyDrops(), it's not replayed on every load. */
function coerceToV3(raw) {
  if (!raw || !Array.isArray(raw.sessions)) return null;
  if (raw.schemaVersion === 3) return normalizeDB(raw);
  if (raw.schemaVersion === 2) return normalizeDB(upgradeDiscoveriesToV3(raw));
  if (raw.schemaVersion === 1) return normalizeDB(upgradeDiscoveriesToV3(migrateV1toV2(raw)));
  return null;
}

function load() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch(_) { raw = null; }
  return coerceToV3(raw) || emptyDB();
}

/* Never let a failed write escape as an exception: save() is called from inside
   completeSortie(), so a throw here unwinds past showLoot() and leaves every
   sortie button disabled (sortieBusy stays true) with nothing on screen saying
   why — and the sortie itself unsaved. Reported once per session so a full
   quota doesn't turn every tap into a dialog. */
let saveFailReported = false;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(DB));
  } catch (err) {
    console.error('[save]', err);
    if (!saveFailReported) { saveFailReported = true; alert(S.saveFailed); }
  }
}

/* pendingReveal lives outside the DB blob — it's UI-recovery state, not save
   data, so it shouldn't round-trip through export/import. The session and its
   loot are already committed to DB (and saved) before this is written, so
   nothing is lost if the tab closes; this only exists to re-show the reveal
   the user hadn't dismissed yet, instead of silently skipping it. */
const PENDING_KEY = 'raidlog_pending_v1';

function savePendingReveal(sessionId, achievementIds) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify({ sessionId, achievementIds })); } catch(_) {}
}

function clearPendingReveal() {
  try { localStorage.removeItem(PENDING_KEY); } catch(_) {}
}

function loadPendingReveal() {
  try {
    const raw = JSON.parse(localStorage.getItem(PENDING_KEY));
    if (raw && raw.sessionId) return raw;
  } catch(_) {}
  return null;
}

let DB = load();

/* ── UTILS ───────────────────────────────────────────────────────────────── */
function uid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }

function localDate(d = new Date()) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

/* tz, when given, pins the display to that IANA zone instead of the viewer's
   current one — a session's time should read the same regardless of which
   timezone the person looking at it is in right now (or has since travelled
   to); every session already records its own timeZone for exactly this. */
function fmtDateTime(iso, tz) {
  const d = new Date(iso);
  const dOpts = { day:'2-digit', month:'2-digit', year:'numeric' };
  const tOpts = { hour:'2-digit', minute:'2-digit' };
  if (tz) { dOpts.timeZone = tz; tOpts.timeZone = tz; }
  return d.toLocaleDateString('ru-RU', dOpts) + ' ' + d.toLocaleTimeString('ru-RU', tOpts);
}

function fmtTime(iso, tz) {
  const tOpts = { hour:'2-digit', minute:'2-digit' };
  if (tz) tOpts.timeZone = tz;
  return new Date(iso).toLocaleTimeString('ru-RU', tOpts);
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}

/* for bare 'YYYY-MM-DD' strings (session.localDate, discoveries.firstLocalDate,
   contract.localDate) — never new Date(str) on one of these: a date-only ISO
   string parses as UTC midnight, so formatting it back via a positive-offset
   local timezone is fine but any negative-offset viewer sees the previous day.
   Parsing the components directly sidesteps that entirely. */
function fmtLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return String(d).padStart(2, '0') + '.' + String(m).padStart(2, '0') + '.' + y;
}

const byId = id => ITEMS.find(i => i.id === id);
const byAct = id => ACTIVITIES.find(a => a.id === id);

/* ── COMPUTED ────────────────────────────────────────────────────────────── */
/* XP is never stored as a running total — always summed from the per-record
   snapshots: session.xpAwarded and contract.xpAwarded (both already written
   at creation time). Falls back to 10/15/25 for older records that predate
   the field existing on that record type. Nothing else grants XP. */
function totalXP() {
  const sortieXP = DB.sessions.reduce((sum, s) => sum + (s.xpAwarded != null ? s.xpAwarded : 10), 0);
  const contractXP = DB.contracts.completed.reduce((sum, c) => sum + (c.xpAwarded != null ? c.xpAwarded : (c.combo ? 25 : 15)), 0);
  return sortieXP + contractXP;
}
function level() { return levelInfo(totalXP()).level; }

/* base 1 + 1 at level 3 + 1 per combo-earned bonus (max observed today: 3,
   since there's only one combo template that grants a slot) */
function displayCapacity() {
  return 1 + (level() >= 3 ? 1 : 0) + (DB.bonusDisplaySlots || 0);
}

/* sum of the best-ever-FOUND item per gear slot + the two best-ever-found
   artifacts (type artifact, any role) — deliberately reads discoveries, never
   gear.appearance: what's currently equipped/worn is cosmetic only and must
   never move this number, so the formular never needs servicing before a raid.
   Weights are RARITY_WEIGHT (1/2/4/7/12), not the rarity index: the deep-sector
   gate (minGearScore 12) was written against that scale. */
function equipmentClass() {
  let total = 0;
  GEAR_SLOTS.forEach(slot => {
    let best = 0;
    ITEMS.forEach(item => {
      if (item.type === 'gear' && item.slot === slot && DB.discoveries[item.id]) {
        const w = RARITY_WEIGHT[item.rarity] || 0;
        if (w > best) best = w;
      }
    });
    total += best;
  });
  const artifactWeights = ITEMS
    .filter(i => i.type === 'artifact' && DB.discoveries[i.id])
    .map(i => RARITY_WEIGHT[i.rarity] || 0)
    .sort((a, b) => b - a)
    .slice(0, 2);
  return total + artifactWeights.reduce((s, w) => s + w, 0);
}

/* Заполненность слотов — тоже по НАЙДЕННОМУ, как и класс: допуск в глубину
   не должен зависеть от того, обслужил ли человек формуляр перед вылазкой. */
function filledSlotCount() {
  return GEAR_SLOTS.filter(slot =>
    ITEMS.some(i => i.type === 'gear' && i.slot === slot && DB.discoveries[i.id])).length;
}

/* Состояние глубокого сектора: условия с отметками, открыт ли, есть ли пропуск.
   Ничего не меняет — только читает. Замок показывается заранее, «умереть»
   в секторе нельзя. */
function deepSectorStatus(sector) {
  const r = sector.requirements;
  const ungated = devMode && devUngateLevels;
  const lvl = level();
  const cls = equipmentClass();
  const slots = filledSlotCount();
  const conditions = [
    { id: 'level', label: S.condLevel, have: lvl,   need: r.minLevel,       met: ungated || lvl >= r.minLevel },
    { id: 'class', label: S.condClass, have: cls,   need: r.minGearScore,   met: ungated || cls >= r.minGearScore },
    { id: 'slots', label: S.condSlots, have: slots, need: r.minFilledSlots, met: ungated || slots >= r.minFilledSlots },
  ];
  (r.requiredItemIds || []).forEach(id => {
    const item = byId(id);
    conditions.push({ id: 'item:' + id, label: item ? item.name : id, item: true, met: ungated || !!DB.discoveries[id] });
  });
  const passes = DB.inventory[sector.passItemId] || 0;
  const unlocked = conditions.every(c => c.met);
  return { conditions, unlocked, passes, ready: unlocked && passes > 0 };
}

function canEnterDeep(sector) { return deepSectorStatus(sector).unlocked; }

/* ПОЛНЫЙ ОБХОД: побывал во всех локациях с момента прошлого замкнутого круга.
   Календарной границы НЕТ намеренно — круг не привязан к суткам, не сгорает
   и не может быть «не успет». Занял два дня или девять — неважно.
   Вычисляется из журнала, ничего не хранится. */
function fullRoundState(sessions) {
  const open = new Set();
  let rounds = 0, startIdx = 0, lastRound = null;
  sessions.forEach((s, i) => {
    if (!byAct(s.activityId)) return;
    if (open.size === 0) startIdx = i;
    open.add(s.activityId);
    if (open.size >= ACTIVITIES.length) {
      rounds++;
      lastRound = { from: sessions[startIdx].localDate, to: s.localDate };
      open.clear();
    }
  });
  return { rounds, open, lastRound };
}

/* Разница в днях по компонентам: YYYY-MM-DD через new Date(str) читается как
   UTC-полночь и съезжает в отрицательных поясах. Date.UTC от чисел безопасен. */
function daysBetweenLocalDates(a, b) {
  if (!a || !b) return 0;
  const [y1, m1, d1] = a.split('-').map(Number);
  const [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}

/* Плотный круг = замкнут за TIGHT_ROUND_DAYS календарных дней или быстрее,
   то есть темпом примерно «по одной локации в день». Медленный круг НИЧЕГО
   не теряет — он даёт тот же наряд; плотный даёт второй. Доплата за темп,
   а не штраф за его отсутствие: дедлайна нет, сгореть нечему. */
const TIGHT_ROUND_DAYS = 4;

function roundSpanDays(lastRound) {
  return lastRound ? daysBetweenLocalDates(lastRound.from, lastRound.to) + 1 : 0;
}

function sessCount(actId) {
  return actId
    ? DB.sessions.filter(s => s.activityId === actId).length
    : DB.sessions.length;
}

function todayCount(actId) {
  const today = localDate();
  return DB.sessions.filter(s => s.activityId === actId && s.localDate === today).length;
}

function activeDays(year, month) {
  const days = new Set();
  DB.sessions.forEach(s => {
    if (!s.localDate) return;
    const [y,m] = s.localDate.split('-').map(Number);
    if (y === year && m === month) days.add(s.localDate);
  });
  return days;
}

function monthSessions(year, month) {
  return DB.sessions.filter(s => {
    if (!s.localDate) return false;
    const [y, m] = s.localDate.split('-').map(Number);
    return y === year && m === month;
  });
}

function monthContractsCompleted(year, month) {
  return DB.contracts.completed.filter(c => {
    if (!c.localDate) return false;
    const [y, m] = c.localDate.split('-').map(Number);
    return y === year && m === month;
  });
}

function monthSummary(year, month) {
  const sess = monthSessions(year, month);
  const contracts = monthContractsCompleted(year, month);
  const byAct = {};
  ACTIVITIES.forEach(a => { byAct[a.id] = 0; });
  sess.forEach(s => { byAct[s.activityId] = (byAct[s.activityId]||0) + 1; });
  const sortieXp = sess.reduce((s, x) => s + (x.xpAwarded != null ? x.xpAwarded : 10), 0);
  const contractXp = contracts.reduce((s, c) => s + (c.xpAwarded != null ? c.xpAwarded : (c.combo ? 25 : 15)), 0);
  return {
    activeDays: new Set(sess.map(s => s.localDate)).size,
    sorties: sess.length,
    xp: sortieXp + contractXp,
    byAct,
  };
}

function bestMonthEver() {
  const counts = {};
  DB.sessions.forEach(s => {
    if (!s.localDate) return;
    const key = s.localDate.slice(0, 7);
    counts[key] = (counts[key]||0) + 1;
  });
  let best = null;
  Object.entries(counts).forEach(([key, count]) => {
    if (!best || count > best.count) best = { key, count };
  });
  return best;
}

/* achievement check helpers — take `state` (a DB-shaped object) so
   check(state)/progress(state) never reach for the global DB directly */
function actSessions(state, actId) {
  return state.sessions.filter(s => s.activityId === actId);
}

function activeDaySet(state) {
  const days = new Set();
  state.sessions.forEach(s => { if (s.localDate) days.add(s.localDate); });
  return days;
}

function bestMonthActiveDayCount(state) {
  const byMonth = {};
  state.sessions.forEach(s => {
    if (!s.localDate) return;
    const key = s.localDate.slice(0, 7);
    (byMonth[key] || (byMonth[key] = new Set())).add(s.localDate);
  });
  let max = 0;
  Object.values(byMonth).forEach(set => { if (set.size > max) max = set.size; });
  return max;
}

const RARITY_ORDER = ['common', 'uncommon', 'rare', 'very_rare', 'legendary'];

function hasRareOrAbove(state) {
  return state.sessions.some(s => (s.drops||[]).some(d => {
    const item = byId(d.itemId);
    return item && RARITY_ORDER.indexOf(item.rarity) >= RARITY_ORDER.indexOf('rare');
  }));
}

/* ── LOOT ────────────────────────────────────────────────────────────────── */
/* Card 1 is always common. Card 2 rolls common/uncommon off the shared table.
   Card 3 rolls the sector's specialChance (0..1); on success it picks a role
   from that sector's weighted channels (SECTOR_LOOT_PROFILES) and an item of
   that role, falling back to a card-2-style material roll on miss or if every
   item for the available roles has already been found. unique items that
   already exist in discoveries are excluded, so they can never redrop —
   non-unique special-channel items (contract_part) stay eligible forever.
   No pity: misses don't raise future odds. */
const MATERIAL_RARITY_TABLE = { common: 78, uncommon: 22 };

function isDiscoveredOrOwned(item) { return !!DB.discoveries[item.id]; }

function materialPool(actId, rarity, exclude) {
  return ITEMS.filter(i => i.type === 'material' && i.rarity === rarity && i.activities.includes(actId) && !exclude.has(i.id));
}

function rollMaterialRarity() {
  return Math.random() * (MATERIAL_RARITY_TABLE.common + MATERIAL_RARITY_TABLE.uncommon) < MATERIAL_RARITY_TABLE.common
    ? 'common' : 'uncommon';
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function rollMaterial(actId, rarity, exclude) {
  const pool = materialPool(actId, rarity, exclude);
  if (pool.length) return pickRandom(pool);
  const otherRarity = rarity === 'common' ? 'uncommon' : 'common';
  const otherPool = materialPool(actId, otherRarity, exclude);
  return otherPool.length ? pickRandom(otherPool) : null;
}

/* sectorId выбирает пул: у базового сектора предметы отбираются по activities,
   у глубокого — по sectors. Пересечения нет by design (validateConfigs следит),
   поэтому предмет глубины не может прийти базовой вылазкой и наоборот. */
function specialPool(actId, role, exclude, sectorId) {
  return ITEMS.filter(i => {
    if (i.role !== role || exclude.has(i.id)) return false;
    if (i.unique && isDiscoveredOrOwned(i)) return false;
    return sectorId ? (i.sectors || []).includes(sectorId) : i.activities.includes(actId);
  });
}

function rollSpecial(actId, exclude, sectorId) {
  const sector = sectorId ? deepSectorById(sectorId) : null;
  const act = byAct(actId);
  const profile = sector ? sector.profile : (act && SECTOR_LOOT_PROFILES[act.location]);
  if (!profile) return null;
  if (Math.random() >= profile.specialChance) return null;

  const buckets = profile.channels
    .map(ch => ({ weight: ch.weight, pool: specialPool(actId, ch.role, exclude, sectorId) }))
    .filter(b => b.pool.length > 0);
  if (!buckets.length) return null;

  const total = buckets.reduce((s, b) => s + b.weight, 0);
  let r = Math.random() * total;
  for (const b of buckets) {
    if (r < b.weight) return pickRandom(b.pool);
    r -= b.weight;
  }
  return pickRandom(buckets[buckets.length - 1].pool);
}

/* Глубина меняет ТРЕТЬЮ карточку, а не удваивает добычу: карточки 1 и 2
   остаются обычными материалами локации. Разница между секторами — в
   эксклюзивности содержимого, а не в «больше того же самого». */
function rollLootV2(actId, sectorId) {
  const exclude = new Set();
  const drops = [];

  const c1 = rollMaterial(actId, 'common', exclude);
  if (c1) { drops.push({ itemId: c1.id }); exclude.add(c1.id); }

  const c2 = rollMaterial(actId, rollMaterialRarity(), exclude);
  if (c2) { drops.push({ itemId: c2.id }); exclude.add(c2.id); }

  const special = rollSpecial(actId, exclude, sectorId);
  if (special) {
    drops.push({ itemId: special.id });
    exclude.add(special.id);
  } else {
    const c3 = rollMaterial(actId, rollMaterialRarity(), exclude);
    if (c3) { drops.push({ itemId: c3.id }); exclude.add(c3.id); }
  }

  return drops;
}

/* ── ACTIONS ─────────────────────────────────────────────────────────────── */
/* discoveries now exists for every type, not just non-material ones —
   inventory is current stock, discoveries is the historical record (first
   found + lifetime total), and a contract spending material stock to zero
   doesn't erase the fact it was found. ctx: { actId, dateStr, isoTimestamp,
   kind: 'sortie'|'contract'|'dev', sourceId }. totalFound is guarded for
   unique items so a repeat call (the dev grant tool bypasses the normal
   no-redrop check on purpose) can't inflate it past 1 or overwrite
   firstSource — a non-unique (contract_part material) always increments. */
function applyDrops(drops, ctx) {
  drops.forEach(d => {
    const item = byId(d.itemId);
    if (!item) return;
    if (item.type === 'material') {
      DB.inventory[item.id] = (DB.inventory[item.id] || 0) + 1;
    }
    let disc = DB.discoveries[item.id];
    if (!disc) {
      disc = DB.discoveries[item.id] = {
        firstFoundAt: ctx.isoTimestamp,
        firstLocalDate: ctx.dateStr,
        firstSource: { kind: ctx.kind, id: ctx.sourceId || null, activityId: ctx.actId || undefined },
        totalFound: 0,
      };
    }
    if (!item.unique || disc.totalFound === 0) disc.totalFound += 1;
    if (item.type === 'gear' && !DB.gear.owned.includes(item.id)) DB.gear.owned.push(item.id);
  });
}

/* ── CONTRACTS ENGINE ────────────────────────────────────────────────────── */
function contractTemplate(id) { return CONTRACT_TEMPLATES.find(t => t.id === id); }

function requirementStatus(templateId) {
  const tpl = contractTemplate(templateId);
  if (!tpl) return [];
  return tpl.requires.map(r => {
    const have = DB.inventory[r.itemId] || 0;
    return { itemId: r.itemId, qty: r.qty, have, met: have >= r.qty };
  });
}

function canFulfillContract(templateId) {
  return requirementStatus(templateId).every(r => r.met);
}

function neededForContracts() {
  const s = new Set();
  DB.contracts.active.forEach(c => {
    const tpl = contractTemplate(c.templateId);
    if (tpl) tpl.requires.forEach(r => s.add(r.itemId));
  });
  return s;
}

/* for the inventory detail modal's "нужно для: <title> (X/Y)" — every active
   contract that requires this item, with its own aggregate progress */
function itemsNeededFor(itemId) {
  return DB.contracts.active
    .map(inst => {
      const tpl = contractTemplate(inst.templateId);
      const req = tpl && tpl.requires.find(r => r.itemId === itemId);
      if (!req) return null;
      return { title: tpl.title, have: Math.min(DB.inventory[itemId] || 0, req.qty), qty: req.qty };
    })
    .filter(Boolean);
}

/* the single active contract closest to being ready — by aggregate progress
   ratio across all of its requirements, not just how many distinct
   requirements are met (a contract 1 unit away from done outranks one that's
   fully met on one requirement but has barely started on another) */
function nearestContract() {
  if (!DB.contracts.active.length) return null;
  let best = null, bestRatio = -1;
  DB.contracts.active.forEach(inst => {
    const status = requirementStatus(inst.templateId);
    const totalQty = status.reduce((s, r) => s + r.qty, 0);
    const haveQty = status.reduce((s, r) => s + Math.min(r.have, r.qty), 0);
    const ratio = totalQty ? haveQty / totalQty : 0;
    if (ratio > bestRatio) { bestRatio = ratio; best = inst; }
  });
  return best;
}

function comboTemplatesEligible() {
  if (!isSystemUnlocked('combo_contracts', level())) return [];
  const closedLocations = new Set(
    DB.contracts.completed.filter(c => !c.combo && c.location).map(c => c.location)
  );
  if (closedLocations.size < 2) return [];
  return CONTRACT_TEMPLATES.filter(t => t.combo
    && !DB.contracts.active.some(a => a.templateId === t.id)
    && !DB.contracts.completed.some(c => c.templateId === t.id)
    // на доску — только после ПЕРВОЙ находки одного из требуемых предметов.
    // Иначе карточка стоит в одном регистре с выполнимыми контрактами и
    // читается как невыполненная работа, единственный путь к которой —
    // «сходить ещё раз, вдруг выпадет пропуск». До находки цель живёт
    // в манифесте сектора, а не слотом на доске
    && t.requires.some(r => DB.discoveries[r.itemId]));
}

/* only ever called from completeSortie(), gated to the first real sortie of a
   new day — never on app open, never from just viewing the calendar. Each
   location is a single regular slot: generation only fills it if it's empty
   (no active regular contract for that location already), so a contract that
   hasn't been submitted yet doesn't get a duplicate stacked on top of it —
   it's replaced only once the player closes it out AND the next real sortie
   of a later day runs. Seeds all 4 slots + the med contract the first time
   this ever runs. Combo/chain contracts aren't slotted — they can coexist
   alongside the 4 regular ones, temporarily growing the board up to the
   10-total cap. */
function generateContracts(dateStr) {
  ACTIVITIES.forEach(a => {
    if (DB.contracts.active.length >= 10) return;
    const slotOccupied = DB.contracts.active.some(inst => {
      const t = contractTemplate(inst.templateId);
      return t && !t.combo && t.location === a.location;
    });
    if (slotOccupied) return;
    // random among the location's templates, not the first match: with .find()
    // every template added after the first for a location would be unreachable
    // forever, which quietly breaks "новый контент — данными, не новым кодом"
    const pool = CONTRACT_TEMPLATES.filter(t => !t.combo && t.location === a.location);
    if (pool.length) DB.contracts.active.push({ id: uid(), templateId: pickRandom(pool).id });
  });

  // фоновые контракты (location: null) слота не занимают: подсеваются, если
  // не висят на доске и не были закрыты. Так добавленный данными фоновый
  // контракт доходит до старого сейва, а не остаётся мёртвым грузом
  CONTRACT_TEMPLATES.filter(t => !t.combo && !t.location).forEach(tpl => {
    if (DB.contracts.active.length >= 10) return;
    if (DB.contracts.active.some(c => c.templateId === tpl.id)) return;
    if (DB.contracts.completed.some(c => c.templateId === tpl.id)) return;
    DB.contracts.active.push({ id: uid(), templateId: tpl.id });
  });

  comboTemplatesEligible().forEach(tpl => {
    if (DB.contracts.active.length < 10) DB.contracts.active.push({ id: uid(), templateId: tpl.id });
  });

  DB.contracts.lastGeneratedLocalDate = dateStr;
}

/* Atomic: check -> deduct -> grant (reward + XP via the completed record,
   read by the existing totalXP() formula — nothing to add explicitly) ->
   save. No partial contributions: the check re-runs here regardless of what
   the UI last showed, so a stale render can never cause an over-deduction. */
function submitContract(activeId) {
  const inst = DB.contracts.active.find(c => c.id === activeId);
  if (!inst) return null;
  const tpl = contractTemplate(inst.templateId);
  if (!tpl || !canFulfillContract(inst.templateId)) return null;

  tpl.requires.forEach(r => {
    const next = (DB.inventory[r.itemId] || 0) - r.qty;
    if (next > 0) DB.inventory[r.itemId] = next; else delete DB.inventory[r.itemId];
  });

  const now = new Date();
  const dateStr = localDate(now);
  const sourceActId = tpl.location ? ACTIVITIES.find(a => a.location === tpl.location)?.id : undefined;
  const rewardDrops = [];
  (tpl.reward.items || []).forEach(ri => { for (let k = 0; k < ri.qty; k++) rewardDrops.push({ itemId: ri.itemId }); });

  const completedId = uid();
  applyDrops(rewardDrops, { actId: sourceActId, dateStr, isoTimestamp: now.toISOString(), kind: 'contract', sourceId: completedId });
  if (tpl.reward.displaySlot) DB.bonusDisplaySlots = (DB.bonusDisplaySlots || 0) + 1;

  DB.contracts.completed.push({
    id: completedId, templateId: tpl.id, combo: !!tpl.combo,
    location: tpl.location || null,
    completedAt: now.toISOString(), localDate: dateStr,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    consumedItems: tpl.requires.map(r => ({ itemId: r.itemId, qty: r.qty })),
    grantedItems: rewardDrops.map(d => d.itemId),
    xpAwarded: tpl.combo ? 25 : 15,
  });
  DB.contracts.active = DB.contracts.active.filter(c => c.id !== activeId);

  save();
  return { tpl, grantedItems: rewardDrops.map(d => d.itemId) };
}

/* opts.date/opts.source let the dev panel run real (backdated) sorties through
   this exact pipeline instead of a separate simulation. A backdated sortie
   never touches contract generation — that stays gated to real, same-day
   play, so a fake past date can't corrupt lastGeneratedLocalDate. */
/* opts.sectorId — глубокий сектор, где была вылазка. Вход платный: проверить →
   списать пропуск → бросить лут глубины → сохранить, тем же порядком, что
   сдача контракта. Если условия не выполнены или пропуска нет, вылазка молча
   идёт в БАЗОВЫЙ сектор, а не отменяется: запретить человеку отметить реальное
   занятие нельзя ни при каких обстоятельствах. */
function completeSortie(actId, opts) {
  opts = opts || {};
  const now = opts.date || new Date();
  const dateStr = localDate(now);

  let sectorId = null;
  const sector = opts.sectorId ? deepSectorById(opts.sectorId) : null;
  if (sector && sector.location === (byAct(actId) || {}).location && canEnterDeep(sector)) {
    const have = DB.inventory[sector.passItemId] || 0;
    if (have > 0) {
      const next = have - 1;
      if (next > 0) DB.inventory[sector.passItemId] = next; else delete DB.inventory[sector.passItemId];
      sectorId = sector.id;
    }
  }

  const drops = rollLootV2(actId, sectorId);

  const sess = {
    id: uid(),
    activityId: actId,
    completedAt: now.toISOString(),
    localDate: dateStr,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    xpAwarded: 10,
    drops,
  };
  // аддитивное поле, schemaVersion остаётся 3: сессия без него = базовый сектор.
  // Без него архив не отличит базовую вылазку от глубокой, и квитанция начнёт
  // врать — а честность архива тут важнее компактности записи
  if (sectorId) sess.sectorId = sectorId;
  if (opts.source) sess.source = opts.source;

  applyDrops(drops, { actId, dateStr, isoTimestamp: sess.completedAt, kind: opts.source === 'dev' ? 'dev' : 'sortie', sourceId: sess.id });

  const roundsBefore = fullRoundState(DB.sessions).rounds;
  DB.sessions.push(sess);
  const roundState = fullRoundState(DB.sessions);
  if (roundState.rounds > roundsBefore) {
    sess.roundClosed = true;
    const span = roundSpanDays(roundState.lastRound);
    sess.roundTight = span > 0 && span <= TIGHT_ROUND_DAYS;
    // наградой за круг служит сам пропуск в глубину: он нужен всегда
    // и тратится всегда, поэтому мёртвым грузом стать не может
    const orders = sess.roundTight ? 2 : 1;
    applyDrops(Array(orders).fill({ itemId: 'pass_sump' }), {
      actId, dateStr, isoTimestamp: sess.completedAt,
      kind: opts.source === 'dev' ? 'dev' : 'sortie', sourceId: sess.id,
    });
  }

  if (!opts.date && DB.contracts.lastGeneratedLocalDate !== dateStr) generateContracts(dateStr);

  save();
  return sess;
}

function checkNewAchievements() {
  const unlocked = DB.achievements.unlocked;
  const now = new Date().toISOString();
  const fresh = [];
  ACHIEVEMENTS.forEach(a => {
    if (unlocked[a.id]) return;
    if (a.check(DB)) { unlocked[a.id] = now; fresh.push(a); }
  });
  if (fresh.length) save();
  return fresh;
}

/* ── DEV TOOLS ───────────────────────────────────────────────────────────── */
/* Everything here is a no-op when devMode is off, on top of the panel that
   calls them not existing in the DOM at all in that case — belt and braces
   against a stray call (console, leftover timer) doing something real. */

/* runs real completeSortie() calls on backdated dates, so loot/discoveries/
   achievements/XP all go through the exact same pipeline as a real sortie */
function generateFakeSorties(count) {
  if (!devMode) return;
  for (let i = 0; i < count; i++) {
    const act = ACTIVITIES[Math.floor(Math.random() * ACTIVITIES.length)];
    const date = new Date();
    date.setDate(date.getDate() - Math.floor(Math.random() * 14));
    date.setHours(Math.floor(Math.random() * 24), Math.floor(Math.random() * 60), Math.floor(Math.random() * 60), 0);
    completeSortie(act.id, { date, source: 'dev' });
  }
  checkNewAchievements();
  render();
}

function itemsByLocationForDev() {
  const groups = {};
  ACTIVITIES.forEach(a => { groups[a.location] = []; });
  const noLocation = [];
  ITEMS.forEach(item => {
    const act = item.activities.length ? ACTIVITIES.find(a => a.id === item.activities[0]) : null;
    if (act) groups[act.location].push(item); else noLocation.push(item);
  });
  return { groups, noLocation };
}

/* grants exactly one item through the same crediting code as loot (inventory
   stacks / discoveries+gear.owned), tagged firstSource.kind:'dev'. Deliberately
   does NOT touch DB.sessions — a debug grant shouldn't hand out XP the way a
   real sortie does. devGrants records it so ОЧИСТИТЬ DEV-СЛЕДЫ can find and
   reverse it later, since it leaves no session behind to reverse from. */
function grantItemDev(itemId) {
  if (!devMode) return false;
  const item = byId(itemId);
  if (!item) return false;
  const now = new Date();
  applyDrops([{ itemId }], { dateStr: localDate(now), isoTimestamp: now.toISOString(), kind: 'dev', sourceId: null });
  DB.devGrants.push({ itemId, at: now.toISOString() });
  checkNewAchievements();
  save();
  return true;
}

/* removes every source:'dev' session and every devGrants entry, reversing what
   each contributed. A non-material item is only removed if its discovery is
   still attributed to a dev source. Materials need real bookkeeping — see the
   comment on devAdded below; the naive per-drop decrement this used to do could
   take back items a real sortie had brought in. */
function clearDevTraces() {
  if (!devMode) return 0;

  function reverseNonMaterial(itemId) {
    const item = byId(itemId);
    if (!item || item.type === 'material') return;
    const disc = DB.discoveries[item.id];
    if (disc && disc.firstSource && disc.firstSource.kind === 'dev') {
      delete DB.discoveries[item.id];
      if (item.type === 'gear') {
        const idx = DB.gear.owned.indexOf(item.id);
        if (idx !== -1) DB.gear.owned.splice(idx, 1);
      }
    }
  }

  /* Materials are a fungible stack: once a dev unit is in inventory it is
     indistinguishable from one a real sortie brought in. Decrementing once per
     dev drop therefore eats real units whenever a contract was closed using dev
     material — that spend already came out of the same stack, so the reversal
     charges it a second time. Example: dev gave 2 bolts, real sorties 2, a
     contract ate 3, one left; two blind decrements clamp it to zero, while
     without the dev sorties the contract could never have been submitted and
     both real bolts would still be there. Counting what dev added and charging
     every contract spend to dev units first makes the reversal take back only
     what dev added and the player still holds. */
  const devAdded = {};
  const countOrReverse = itemId => {
    const item = byId(itemId);
    if (item && item.type === 'material') devAdded[itemId] = (devAdded[itemId] || 0) + 1;
    else reverseNonMaterial(itemId);
  };

  const devSessions = DB.sessions.filter(s => s.source === 'dev');
  devSessions.forEach(sess => (sess.drops || []).forEach(d => countOrReverse(d.itemId)));
  DB.devGrants.forEach(g => countOrReverse(g.itemId));

  const consumed = {};
  DB.contracts.completed.forEach(c => (c.consumedItems || []).forEach(r => {
    consumed[r.itemId] = (consumed[r.itemId] || 0) + r.qty;
  }));

  Object.keys(devAdded).forEach(id => {
    const have = DB.inventory[id] || 0;
    const take = Math.min(have, Math.max(0, devAdded[id] - (consumed[id] || 0)));
    const next = have - take;
    if (next > 0) DB.inventory[id] = next; else delete DB.inventory[id];
  });

  DB.sessions = DB.sessions.filter(s => s.source !== 'dev');
  DB.devGrants = [];

  save();
  render();
  return devSessions.length;
}

/* ── STATE ───────────────────────────────────────────────────────────────── */
let tab = 'sortie';
let tabStack = [];   // screens (system/contracts) can open from one another, so a
                      // single prevTab isn't enough once navigation nests two deep
let sortieBusy = false;
let armedActId = null;      // activity whose button is armed, awaiting the confirming second tap
let armedSectorId = null;   // и сектор той же кнопки: у локации их может быть несколько
let armedTimer = null;
let calY = new Date().getFullYear();
let calM = new Date().getMonth() + 1;
let devMode = localStorage.getItem(DEV_MODE_KEY) === '1';
let devUngateLevels = localStorage.getItem(DEV_UNGATE_KEY) === '1'; // only has any effect while devMode is also on
let versionTapCount = 0;
let versionTapTimer = null;

function tapVersion() {
  versionTapCount++;
  if (versionTapTimer) clearTimeout(versionTapTimer);
  versionTapTimer = setTimeout(() => { versionTapCount = 0; }, 2000);
  if (versionTapCount < 5) return;
  versionTapCount = 0;
  clearTimeout(versionTapTimer);
  devMode = !devMode;
  try {
    if (devMode) localStorage.setItem(DEV_MODE_KEY, '1');
    else localStorage.removeItem(DEV_MODE_KEY);
  } catch(_) {}
  renderCurrent();
}

function toggleDevUngate() {
  if (!devMode) return;
  devUngateLevels = !devUngateLevels;
  try {
    if (devUngateLevels) localStorage.setItem(DEV_UNGATE_KEY, '1');
    else localStorage.removeItem(DEV_UNGATE_KEY);
  } catch(_) {}
  renderCurrent();
}

function openScreen(name) {
  tabStack.push(tab);
  tab = name;
  renderCurrent();
}

function closeScreen() {
  tab = tabStack.pop() || 'sortie';
  renderCurrent();
}

function armSortie(actId, sectorId) {
  armedActId = actId;
  armedSectorId = sectorId || null;
  if (armedTimer) clearTimeout(armedTimer);
  armedTimer = setTimeout(() => {
    armedActId = null; armedSectorId = null; armedTimer = null; renderCurrent();
  }, 4000);
  renderCurrent();
}

function disarmSortie() {
  if (armedTimer) { clearTimeout(armedTimer); armedTimer = null; }
  armedActId = null;
  armedSectorId = null;
}

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function render() { renderHeader(); renderCurrent(); }

function renderHeader(xpOverride) {
  const li = levelInfo(xpOverride !== undefined ? xpOverride : totalXP());
  const pct = li.xpForLevel ? Math.round(li.xpIntoLevel / li.xpForLevel * 100) : 100;
  document.getElementById('hxp-rank').textContent = rankForLevel(li.level) + ' · ' + S.level + ' ' + li.level;
  document.getElementById('hxp-fill').style.width = pct + '%';
  document.getElementById('hxp-xp').textContent = li.xpIntoLevel + ' / ' + li.xpForLevel + ' XP';
}

function animateXpCountUp(fromXp, toXp, duration) {
  const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (rm || toXp <= fromXp) { renderHeader(); return; }
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    renderHeader(Math.round(fromXp + (toXp - fromXp) * t));
    if (t < 1) requestAnimationFrame(step); else renderHeader();
  }
  requestAnimationFrame(step);
}

function renderCurrent() {
  document.querySelectorAll('.t-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['sortie','inventory','calendar','achievements','system','contracts','gear'].forEach(t => {
    document.getElementById('tab-' + t).hidden = (t !== tab);
  });
  const el = document.getElementById('tab-' + tab);
  if (tab === 'sortie')       renderSortie(el);
  if (tab === 'inventory')    renderInventory(el);
  if (tab === 'calendar')     renderCalendar(el);
  if (tab === 'achievements') renderAchievements(el);
  if (tab === 'system')       renderSystem(el);
  if (tab === 'contracts')    renderContracts(el);
  if (tab === 'gear')         renderGear(el);
}

/* ── SORTIE ──────────────────────────────────────────────────────────────── */
/* shared by the full board (renderContracts) and the single nearest-contract
   card on ВЫЛАЗКА (nearestContractCardHtml) — extraFooterHtml lets the sortie
   card add its own "ОТКРЫТЬ ДОСКУ" button below the submit button */
function contractCardHtml(inst, extraFooterHtml) {
  const tpl = contractTemplate(inst.templateId);
  if (!tpl) return '';
  const status = requirementStatus(inst.templateId);
  const ready = status.every(r => r.met);
  const locLabel = tpl.combo ? tpl.locations.join(' × ') : (tpl.location || S.contractAnyLoc);
  const accent = tpl.combo ? 'var(--acc)' : (ACTIVITIES.find(a => a.location === tpl.location)?.accent || 'var(--brd)');
  const comboTag = tpl.combo ? `<span class="contract-combo-tag">${S.contractComboTag}</span> ` : '';
  const reqRows = status.map(r => {
    const item = byId(r.itemId);
    return `<div class="req-row${r.met ? ' req-met' : ''}">
      <span class="req-mark">${r.met ? '✓' : '·'}</span>
      <span class="req-name">${item ? item.name : r.itemId}</span>
      <b>${r.have} / ${r.qty}</b>
    </div>`;
  }).join('');
  return `<div class="contract-card" style="border-color:${accent}">
    <div class="contract-title" style="color:${accent}">${comboTag}${tpl.title}</div>
    <div class="contract-loc">${locLabel}</div>
    <div class="contract-reqs">${reqRows}</div>
    <button class="d-btn contract-submit" data-a="contract-submit" data-cid="${inst.id}" ${ready ? '' : 'disabled'}>${S.contractSubmitBtn}</button>
    ${extraFooterHtml || ''}
  </div>`;
}

function nearestContractCardHtml() {
  if (!isSystemUnlocked('contracts', level())) return '';
  const inst = nearestContract();
  if (!inst) return '';
  return contractCardHtml(inst, `<button class="scr-nav-btn" data-a="open-contracts" style="margin:8px 0 0">${S.openBoardBtn}</button>`);
}

function renderSortie(el) {
  // Накопительные числа, а не месячные: месячное обнуляется первого числа,
  // то есть умеет падать — а величина, способная упасть, читается как отчёт
  // о падении. Месячная сводка живёт в календаре, как факт закрытого периода.
  const totalDays = activeDaySet(DB).size;

  let html = '';
  ACTIVITIES.forEach(a => {
    const tc = todayCount(a.id);
    const tot = sessCount(a.id);
    const armed = armedActId === a.id && !armedSectorId;
    const label = armed
      ? `<span class="cmp-btn-main">${S.confirmSortiePrefix}: ${a.name.toUpperCase()}</span><span class="cmp-btn-sub">${a.location}</span>`
      : S.completeBtn;
    const todayHtml = tc > 0 ? `<span>${S.todaySess} ×<b>${tc}</b></span>` : '';

    /* Глубокие секторы локации. Остаток пропусков до отметки занятия НЕ
       показываем нигде: счётчик на предвылазочном экране за пару недель
       превращает механику в планирование занятия под сектор. */
    let deepHtml = '';
    deepSectorsFor(a.location).forEach(sec => {
      const st = deepSectorStatus(sec);
      if (st.ready) {
        const armedDeep = armedActId === a.id && armedSectorId === sec.id;
        const dLabel = armedDeep
          ? `<span class="cmp-btn-main">${S.confirmSortiePrefix}: ${sec.name.toUpperCase()}</span><span class="cmp-btn-sub">${S.sectorPassCost}</span>`
          : `${S.sectorReturnPrefix}: ${sec.name.toUpperCase()}`;
        deepHtml += `<button class="cmp-btn deep${armedDeep ? ' armed' : ''}" data-a="complete" data-act="${a.id}" data-sector="${sec.id}">${dLabel}</button>`;
      } else {
        const text = st.unlocked ? S.sectorNeedPass : S.sectorLocked;
        deepHtml += `<button class="sector-lock" data-a="sector-info" data-sector="${sec.id}">
          <span class="sector-lock-glyph">⚿</span>
          <span class="sector-lock-name">${sec.name}</span>
          <span class="sector-lock-state">${text}</span>
        </button>`;
      }
    });

    const rank = activityRank(tot);
    const rankHtml = rank.name
      ? `<div class="act-rank">
           <span class="act-stars" style="color:${a.accent}">${'★'.repeat(rank.stars)}${'☆'.repeat(rank.total - rank.stars)}</span>
           <span class="act-rank-name">${rank.name}</span>
           ${rank.next ? `<span class="act-rank-next">${S.rankNext}: ${rank.next}</span>` : ''}
         </div>`
      : '';

    html += `<div class="act-card" style="border-color:${a.accent}">
      <div class="act-hdr">
        <div class="act-name" style="color:${a.accent}">${a.name}</div>
        <div class="act-gname">${a.gameName}</div>
      </div>
      ${rankHtml}
      <div class="act-meta">
        ${todayHtml}
        <span>${S.totalSessLbl}: <b>${tot}</b></span>
      </div>
      <button class="cmp-btn${armed?' armed':''}" data-a="complete" data-act="${a.id}">${label}</button>
      ${deepHtml}
    </div>`;
  });

  html += nearestContractCardHtml();

  el.innerHTML =
    `<div class="sbar"><span>${S.journalLine}: <b>${totalDays}</b> ${S.journalDays} · <b>${DB.sessions.length}</b> ${S.journalSorties}</span></div>` +
    `<div class="sec">${html}</div>`;
}

/* ── INVENTORY ───────────────────────────────────────────────────────────── */
function invSection(title, items, cntFn, neededSet) {
  if (!items.length) return '';
  const cards = items.map(item => {
    const needed = neededSet && neededSet.has(item.id);
    return `<div class="inv-item${needed ? ' needed' : ''}" role="button" tabindex="0" data-r="${item.rarity}" data-a="inv-detail" data-iid="${item.id}">
      <span class="i-cnt">${cntFn(item)}</span>
      ${needed ? `<span class="i-need">${S.neededForContract}</span>` : ''}
      <div class="i-icon">${item.glyph}</div>
      <div class="i-name">${item.name}</div>
      <div class="i-rar">${S.rarities[item.rarity]}</div>
    </div>`;
  }).join('');
  return `<div class="inv-sub">${title}</div><div class="inv-grid">${cards}</div>`;
}

function renderInventory(el) {
  const li = levelInfo(totalXP());
  const pct = li.xpForLevel ? Math.round(li.xpIntoLevel / li.xpForLevel * 100) : 100;

  let html = `<div class="xp-blk">
    <div class="xp-lbl">${rankForLevel(li.level)}</div>
    <div class="xp-lvl">${S.level} ${li.level}</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="xp-sub">${li.xpIntoLevel} / ${li.xpForLevel} XP | ${li.xpToNext} ${S.xpToNext}</div>
  </div>`;

  const readyCount = DB.contracts.active.filter(c => canFulfillContract(c.templateId)).length;
  html += `<button class="scr-nav-btn" data-a="open-contracts">
    <span>${S.contractsNavLabel}</span>
    ${readyCount ? `<span class="scr-nav-badge">${S.contractsReward}</span>` : ''}
  </button>`;

  html += `<button class="scr-nav-btn" data-a="open-gear">
    <span>${S.gearNavLabel}</span>
    <span class="scr-nav-badge">${S.gearClass} ${equipmentClass()}</span>
  </button>`;

  const materials    = ITEMS.filter(i => i.type === 'material'   && DB.inventory[i.id] > 0);
  const gear         = ITEMS.filter(i => i.type === 'gear'       && DB.discoveries[i.id]);
  const collectibles = ITEMS.filter(i => i.type === 'collectible' && DB.discoveries[i.id]);
  const artifacts    = ITEMS.filter(i => i.type === 'artifact'   && DB.discoveries[i.id]);

  if (!materials.length && !gear.length && !collectibles.length && !artifacts.length) {
    html += `<div class="inv-empty">${S.invEmpty}</div>`;
  } else {
    // у пропуска счётчик не показывается: остаток превращает документ
    // в валютный баланс, который можно проверить перед занятием
    html += invSection(S.invMaterials, materials,
      item => item.role === 'sector_pass' ? S.passOnHand : 'x' + DB.inventory[item.id],
      neededForContracts());
    html += invSection(S.invGear,         gear,         () => '');
    html += invSection(S.invCollectibles, collectibles, () => '');
    html += invSection(S.invArtifacts,    artifacts,    () => '');
  }
  el.innerHTML = html;
}

/* ── GEAR (формуляр оператора) ───────────────────────────────────────────── */
/* Экран ничего не считает сам — он показывает то, что equipmentClass() уже
   считает по discoveries. Надевание бесплатно, обратимо, XP не даёт и на
   допуски не влияет: приз за реальное занятие не зависит от того, обслужил
   ли человек формуляр. Надетое хранится в gear.appearance (косметика). */
function gearPoolForSlot(slot) { return ITEMS.filter(i => i.type === 'gear' && i.slot === slot); }
function foundGearForSlot(slot) { return gearPoolForSlot(slot).filter(i => DB.discoveries[i.id]); }
function foundArtifacts() { return ITEMS.filter(i => i.type === 'artifact' && DB.discoveries[i.id]); }

function gearRowHtml(label, item, available, action, attrs) {
  const mark = item
    ? `<span class="gear-mark" style="background:var(--r-${item.rarity})">${item.glyph}</span>`
    : `<span class="gear-mark" style="background:var(--brd);color:var(--dim)">·</span>`;
  const body = item
    ? `<span class="gear-val">${item.name}</span><span class="gear-w">${S.gearWeight} ${RARITY_WEIGHT[item.rarity]}</span>`
    : `<span class="gear-val empty">${available ? S.gearEmptySlot : S.gearNothingFound}</span>`;
  return `<button class="gear-row" data-a="${action}" ${attrs}${available ? '' : ' disabled'}>
    <span class="gear-slot">${label}</span>${mark}${body}
  </button>`;
}

function renderGear(el) {
  const header = `<div class="scr-hdr">
      <button class="scr-back" data-a="close-gear">&lt;</button>
      <div class="scr-title">${S.gearTitle}</div>
    </div>`;

  // слот, под который в игре ещё нет ни одного предмета, не рисуется пустой
  // дыркой — формуляр показывает только то, что покрыто пулами
  const slotsHtml = GEAR_SLOTS.filter(slot => gearPoolForSlot(slot).length).map(slot => {
    const equippedId = DB.gear.appearance[slot];
    const equipped = equippedId ? byId(equippedId) : null;
    return gearRowHtml(S.slots[slot], equipped, foundGearForSlot(slot).length > 0, 'gear-pick', `data-slot="${slot}"`);

/* ── ACHIEVEMENTS ────────────────────────────────────────────────────────── */
/* сверху последние полученные, затем 2-3 ближайшие цели с прогрессом,
   остальное — свёрнуто (native <details> — no JS needed for the toggle) */
function renderAchievements(el) {
  const unlocked = DB.achievements.unlocked;

  const pendingCardHtml = a => {
    const p = a.progress ? a.progress(DB) : null;
    const progHtml = p
      ? `<div class="prog-bar"><div class="prog-fill" style="width:${Math.round(p.cur/p.max*100)}%"></div></div>
         <div class="prog-txt"><b>${p.cur} / ${p.max}</b></div>`
      : '';
    return `<div class="ach-card">
      <div class="ach-title">${a.title}</div>
      ${progHtml}
      <div class="ach-desc">${a.desc}</div>
    </div>`;
  };
  const doneCardHtml = a => `<div class="ach-card done">
    <div class="ach-title">${a.title}</div>
    <div class="ach-date">${S.achUnlockedOn}: ${fmtDate(unlocked[a.id])}</div>
    <div class="ach-desc">${a.desc}</div>
  </div>`;

  const doneAll = ACHIEVEMENTS.filter(a => unlocked[a.id])
    .sort((a, b) => unlocked[b.id].localeCompare(unlocked[a.id]));
  const recentDone = doneAll.slice(0, 3);
  const olderDone = doneAll.slice(3);

  const pendingRanked = ACHIEVEMENTS.filter(a => !unlocked[a.id])
    .map(a => ({ a, ratio: a.progress ? a.progress(DB).cur / a.progress(DB).max : 0 }))
    .sort((x, y) => y.ratio - x.ratio)
    .map(x => x.a);
  const nearest = pendingRanked.slice(0, 3);
  const restPending = pendingRanked.slice(3);

  let html = recentDone.map(doneCardHtml).join('') + nearest.map(pendingCardHtml).join('');

  const rest = [...restPending, ...olderDone];
  if (rest.length) {
    html += `<details class="ach-collapsed">
      <summary>${S.achMoreLabel} (${rest.length})</summary>
      ${rest.map(a => unlocked[a.id] ? doneCardHtml(a) : pendingCardHtml(a)).join('')}
    </details>`;
  }

  el.innerHTML = `<div class="sec">${html}</div>`;
}

/* ── LOOT REVEAL ─────────────────────────────────────────────────────────── */
/* Квитанция строится ПО ФАКТУ уже сохранённой сессии: ничего не начисляет,
   ничего не списывает, только читает. Порядок дебрифа — факт, лут, ВЛИЯНИЕ
   (что сдвинулось в контрактах), СЛЕДУЮЩИЙ ОРИЕНТИР. */
/* Только то, что РЕАЛЬНО сдвинулось этой вылазкой. «Сколько упало» известно
   из session.drops, значит «было» = «стало минус упало» — снимок хранить
   не нужно. Иначе в ВЛИЯНИЕ попадал бы контракт, укомплектованный ещё вчера,
   и заголовок обещал бы дельту, а показывал связь. */
function receiptImpactRows(session) {
  const dropped = {};
  (session.drops || []).forEach(d => { dropped[d.itemId] = (dropped[d.itemId] || 0) + 1; });

  const seen = new Map();
  Object.keys(dropped).forEach(itemId => {
    const item = byId(itemId);
    if (!item || item.type !== 'material') return;
    DB.contracts.active.forEach(inst => {
      const tpl = contractTemplate(inst.templateId);
      const req = tpl && tpl.requires.find(r => r.itemId === itemId);
      if (!req) return;
      const have = DB.inventory[itemId] || 0;
      const after = Math.min(have, req.qty);
      const before = Math.min(Math.max(have - dropped[itemId], 0), req.qty);
      if (after > before) seen.set(tpl.title, { title: tpl.title, have: after, qty: req.qty });
    });
  });
  return [...seen.values()];
}

/* Назначение предмета на карточке лута НЕ пишется: то же самое ниже говорит
   ВЛИЯНИЕ (и только про то, что реально сдвинулось), а подробности — в
   карточке предмета из инвентаря. На 104px ширины это была третья строка
   мелким шрифтом, дублирующая квитанцию. */

function nextBeaconText() {
  const inst = nearestContract();
  if (inst) {
    const tpl = contractTemplate(inst.templateId);
    const missing = requirementStatus(inst.templateId).filter(r => !r.met);
    if (!missing.length) return tpl.title + ' — ' + S.beaconReady;
    const m = missing[0];
    const item = byId(m.itemId);
    // без арифметики: ориентир называет ВЕЩЬ И МЕСТО. Как только тут появится
    // число, строка из адреса превратится в квоту («ещё 2 вылазки до…»)
    return tpl.title + ' · ' + (item ? item.name : m.itemId);
  }
  const li = levelInfo(totalXP());
  const nextUnlock = LEVEL_UNLOCKS.find(u => u.level > li.level);
  return S.beaconMilestone + ' · ' + (nextUnlock ? nextUnlock.label : S.beaconNextLevel);
}

function showLoot(session, newAchievements, beforeXp) {
  const drops = session.drops || [];
  const achs = newAchievements || [];
  const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const act = byAct(session.activityId);
  const sector = session.sectorId ? deepSectorById(session.sectorId) : null;
  const fromXp = beforeXp != null ? beforeXp : totalXP();
  const toXp = totalXP();

  const cardsHtml = drops.map((d, i) => {
    const item = byId(d.itemId);
    if (!item) return '';
    return `<div class="loot-card${rm?' vis glow':''}" data-r="${item.rarity}" data-idx="${i}">
      <div class="lc-icon">${item.glyph}</div>
      <div class="lc-name">${item.name}</div>
      <div class="lc-rarity">${S.rarities[item.rarity]}</div>
    </div>`;
  }).join('');

  const sortieNo = DB.sessions.findIndex(s => s.id === session.id) + 1;
  const firstTime = drops.filter(d => {
    const disc = DB.discoveries[d.itemId];
    return disc && disc.totalFound === 1;
  }).length;

  const impact = receiptImpactRows(session);
  const impactHtml = impact.length
    ? impact.map(n => `<div class="rc-row"><span>${n.title}</span><b>${n.have} / ${n.qty}</b></div>`).join('')
    : `<div class="rc-row rc-none">${S.receiptNoImpact}</div>`;

  const lvlBefore = levelInfo(fromXp).level;
  const lvlAfter = levelInfo(toXp).level;
  let flashHtml = '';
  if (lvlAfter > lvlBefore) {
    const unlock = LEVEL_UNLOCKS.find(u => u.level > lvlBefore && u.level <= lvlAfter);
    flashHtml = `<div class="rc-flash">${unlock ? S.accessExpanded + ': ' + unlock.label : S.levelUp + ': ' + lvlAfter}</div>`;
  }

  // звание локации: жаргонная строка казённым голосом системы
  const actCount = sessCount(session.activityId);
  const rankAfter = activityRank(actCount);
  if (act && rankAfter.index > activityRank(actCount - 1).index) {
    flashHtml += `<div class="rc-flash">${S.rankUp}: ${act.location.toUpperCase()} — ${rankAfter.name}</div>`;
  }
  if (session.roundClosed) {
    flashHtml += `<div class="rc-flash">${session.roundTight ? S.roundTight : S.roundClosed}</div>`;
  }

  const receiptHtml = `<div class="receipt" id="receipt" hidden>
    <div class="rc-title">${S.receiptTitle}</div>
    ${flashHtml}
    <div class="rc-row"><span>${S.receiptSortieNo}${sortieNo}</span><b>${act ? act.name : ''}</b></div>
    <div class="rc-row"><span>${S.receiptSector}</span><b>${sector ? sector.name : (act ? act.location : '—')}</b></div>
    ${sector ? `<div class="rc-row rc-none">${S.sectorPassSpent}</div>` : ''}
    <div class="rc-row"><span>${S.receiptXp}</span><b>+${toXp - fromXp} XP</b></div>
    <div class="rc-row"><span>${S.receiptFinds}</span><b>${drops.length}${firstTime ? ' · ' + firstTime + ' ' + S.receiptFirstTime : ''}</b></div>
    <div class="rc-sub">${S.receiptImpact}</div>
    ${impactHtml}
    <div class="rc-sub">${S.receiptNext}</div>
    <div class="rc-row rc-beacon">${nextBeaconText()}</div>
  </div>`;

  mc.innerHTML = `<div class="loot-ov">
    <div class="loot-title">${S.sectorReturnPrefix}${sector ? ': ' + sector.name.toUpperCase() : (act ? ': ' + act.location.toUpperCase() : '')}</div>
    <div class="loot-cards" id="lc">${cardsHtml}</div>
    <div class="ach-queue" id="ach-queue"></div>
    ${receiptHtml}
    <div class="loot-acts">
      ${!rm ? `<button class="l-btn" id="skip-btn">${S.skipAnim}</button>` : ''}
      <button class="l-btn pri" id="close-loot" ${!rm?'style="display:none"':''}>${S.closeLoot}</button>
    </div>
  </div>`;

  const cards = mc.querySelectorAll('.loot-card');
  const closeBtn = mc.querySelector('#close-loot');
  const skipBtn  = mc.querySelector('#skip-btn');
  const achQueueEl = mc.querySelector('#ach-queue');

  function queueAchievements() {
    let i = 0;
    function showNext() {
      if (i >= achs.length) return;
      const a = achs[i++];
      const toast = document.createElement('div');
      toast.className = 'ach-toast';
      toast.textContent = '>> ' + S.achToastPrefix + ': ' + a.title;
      achQueueEl.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('vis'));
      setTimeout(showNext, 900);
    }
    showNext();
  }

  const receiptEl = mc.querySelector('#receipt');

  let revealDone = false;
  function finishReveal() {
    if (revealDone) return;
    revealDone = true;
    if (skipBtn) skipBtn.style.display = 'none';
    closeBtn.style.display = '';
    queueAchievements();
    // квитанция и полоса XP — последними: сперва вещи, потом отчёт о них
    if (receiptEl) receiptEl.hidden = false;
    animateXpCountUp(fromXp, toXp, rm ? 0 : 900);
  }

  function revealAll() {
    cards.forEach(c => { c.classList.add('vis'); setTimeout(() => c.classList.add('glow'), 60); });
    finishReveal();
  }

  if (!rm) {
    let i = 0;
    function next() {
      if (i >= cards.length) { finishReveal(); return; }
      const c = cards[i];
      c.classList.add('vis');
      const r = c.dataset.r;
      const glowDelay = (r==='rare'||r==='very_rare'||r==='legendary') ? 150 : 100;
      setTimeout(() => c.classList.add('glow'), glowDelay);
      i++;
      const pause = (r==='rare'||r==='very_rare'||r==='legendary') ? 800 : 520;
      setTimeout(next, pause);
    }
    setTimeout(next, 250);
    if (skipBtn) skipBtn.addEventListener('click', revealAll);
  } else {
    finishReveal();
  }

  closeBtn.addEventListener('click', () => { sortieBusy = false; clearPendingReveal(); mc.innerHTML = ''; render(); });
}

/* presentation for a completed contract — distinct from the random loot
   reveal: a flash, the reward card(s), and an XP count-up rather than a
   staggered card-by-card reveal (there's nothing to build suspense about,
   the reward was guaranteed the moment requirements were met) */
function showContractReward(tpl, grantedItemIds, beforeXp, afterXp) {
  const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cardsHtml = grantedItemIds.map(id => {
    const item = byId(id);
    if (!item) return '';
    return `<div class="loot-card vis glow" data-r="${item.rarity}">
      <div class="lc-icon">${item.glyph}</div>
      <div class="lc-name">${item.name}</div>
      <div class="lc-rarity">${S.rarities[item.rarity]}</div>
    </div>`;
  }).join('');

  mc.innerHTML = `<div class="loot-ov">
    ${!rm ? '<div class="contract-flash"></div>' : ''}
    <div class="loot-title">${S.contractDoneTitle}</div>
    <div class="contract-reward-name">${tpl.title}</div>
    <div class="loot-cards">${cardsHtml}</div>
    <div class="contract-xp-gain">+${afterXp - beforeXp} XP</div>
    <div class="loot-acts">
      <button class="l-btn pri" id="close-loot">${S.closeLoot}</button>
    </div>
  </div>`;

  animateXpCountUp(beforeXp, afterXp, rm ? 0 : 700);

  mc.querySelector('#close-loot').addEventListener('click', () => {
    mc.innerHTML = '';
    render(); // returns to the (freshly updated) contracts screen, ready for the next one
  });
}

/* ── LOG EXPORT (CSV / HTML) ─────────────────────────────────────────────── */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function sessionsLogRows() {
  const header = [S.logColDate, S.logColTime, S.logColAct, S.logColXp, S.logColDrops];
  const body = DB.sessions.map(s => [
    s.localDate || '',
    fmtTime(s.completedAt, s.timeZone),
    byAct(s.activityId)?.name || s.activityId,
    s.xpAwarded != null ? s.xpAwarded : 10,   // same fallback as totalXP(), or migrated sessions export as 0 XP
    (s.drops || []).map(d => byId(d.itemId)?.name || d.itemId).join(', '),
  ]);
  return { header, body };
}

function csvEscape(val) {
  const str = String(val);
  return /[";\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function exportSessionsCsv() {
  const { header, body } = sessionsLogRows();
  const csv = [header, ...body].map(row => row.map(csvEscape).join(';')).join('\r\n');
  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), 'raidlog_sessions_' + localDate() + '.csv');
}

function exportSessionsHtml() {
  const { header, body } = sessionsLogRows();
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const thead = '<tr>' + header.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>';
  const tbody = body.map(row => '<tr>' + row.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('');
  const html = `<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>${esc(S.logTitle)}</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f4f0; color:#222; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .meta { color:#666; font-size:13px; margin-bottom:16px; }
  table { border-collapse: collapse; width:100%; background:#fff; }
  th, td { border:1px solid #ccc; padding:6px 10px; font-size:14px; text-align:left; }
  th { background:#222; color:#fff; }
  tr:nth-child(even) td { background:#f9f9f6; }
</style></head>
<body>
  <h1>${esc(S.logTitle)}</h1>
  <div class="meta">${esc(S.logExportedAt)}: ${esc(fmtDateTime(new Date().toISOString()))} · ${esc(S.logTotalSorties)}: ${body.length}</div>
  <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>
</body></html>`;
  downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), 'raidlog_sessions_' + localDate() + '.html');
}

/* ── EVENTS ──────────────────────────────────────────────────────────────── */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.t-btn');
  if (!b) return;
  // calY/calM are set once at load; a PWA left open past midnight on the 1st
  // would otherwise open КАЛЕНДАРЬ on last month with no "сегодня" marker.
  // Reset on entry, not inside renderCalendar() — that would break cal-prev/next.
  if (b.dataset.tab === 'calendar' && tab !== 'calendar') {
    const n = new Date();
    calY = n.getFullYear();
    calM = n.getMonth() + 1;
  }
  tab = b.dataset.tab;
  renderCurrent();
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  switch (t.dataset.a) {

    case 'open-system':    openScreen('system');    break;
    case 'close-system':   closeScreen();            break;
    case 'open-contracts': openScreen('contracts');  break;
    case 'close-contracts': closeScreen();           break;
    case 'open-gear':      openScreen('gear');       break;
    case 'close-gear':     closeScreen();            break;
    case 'gear-pick':      showGearPicker(t.dataset.slot);            break;
    case 'gear-pick-art':  showArtifactPicker(Number(t.dataset.idx)); break;
    case 'version-tap':    tapVersion();              break;

    case 'dev-fake-sorties': generateFakeSorties(10); break;

    case 'dev-grant-item': {
      const sel = document.getElementById('dev-item-select');
      if (sel && sel.value && grantItemDev(sel.value)) render();
      break;
    }

    case 'dev-toggle-ungate': toggleDevUngate(); break;
    case 'dev-clear-traces':  clearDevTraces();  break;

    case 'sector-info': showSectorInfo(t.dataset.sector); break;

    case 'complete': {
      if (sortieBusy) return;
      const actId = t.dataset.act;
      const sectorId = t.dataset.sector || null;

      if (armedActId !== actId || armedSectorId !== sectorId) {
        armSortie(actId, sectorId);
        return;
      }

      // second tap within the 4s window — commit. No cancel past this point.
      disarmSortie();
      sortieBusy = true;
      document.querySelectorAll('.cmp-btn').forEach(b => b.disabled = true);

      const beforeXp = totalXP();
      const sess = completeSortie(actId, sectorId ? { sectorId } : undefined);
      const newAch = checkNewAchievements();
      savePendingReveal(sess.id, newAch.map(a => a.id));
      // шапка пока показывает старое значение: полоса догоняет в квитанции,
      // а не прыгает до того, как человек увидел, за что
      renderHeader(beforeXp);
      showLoot(sess, newAch, beforeXp);
      break;
    }

    case 'inv-detail': showInvDetail(t.dataset.iid); break;

    case 'contract-submit': {
      const beforeXp = totalXP();
      const result = submitContract(t.dataset.cid);
      if (!result) { renderCurrent(); break; } // stale button state (shouldn't happen) -- just refresh
      checkNewAchievements();
      showContractReward(result.tpl, result.grantedItems, beforeXp, totalXP());
      break;
    }

    case 'cal-prev':
      if (--calM < 1) { calM = 12; calY--; }
      renderCurrent();
      break;

    case 'cal-next':
      if (++calM > 12) { calM = 1; calY++; }
      renderCurrent();
      break;

    case 'cal-day': showDayDetail(t.dataset.date); break;

    case 'export': {
      downloadBlob(new Blob([JSON.stringify(DB,null,2)], {type:'application/json'}), 'raidlog_' + localDate() + '.json');
      break;
    }

    case 'export-csv':  exportSessionsCsv();  break;
    case 'export-html': exportSessionsHtml(); break;

    case 'import': {
      if (!await confirm_('Импорт', S.confirmImport)) return;
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = e2 => {
        const f = e2.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const coerced = coerceToV3(parsed);
            // silence here read as success: the user had just confirmed
            // "прогресс будет заменён" and got no reaction either way
            if (coerced) { DB = coerced; save(); render(); }
            else alert(S.importFailed);
          } catch(err) {
            console.error('[import]', err);
            alert(S.importFailed);
          }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }

    case 'reset': {
      if (!await confirm_('Сброс', S.confirmReset)) return;
      DB = emptyDB(); save(); render();
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key==='Enter'||e.key===' ') {
    const t = e.target.closest('[data-a]');
    if (t && !t.matches('button')) { e.preventDefault(); t.click(); }
  }
});

/* ── SAFARI HINT ─────────────────────────────────────────────────────────── */
(function() {
  const HINT_KEY = 'raidlog_hint_v1';
  if (localStorage.getItem(HINT_KEY)) return;
  const standalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) return;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|FxiOS/.test(navigator.userAgent);
  if (!isIOS || !isSafari) return;

  const hint = document.createElement('div');
  hint.className = 'safari-hint';
  hint.innerHTML = `<div class="sh-title">${S.safari.title}</div>
    <div>${S.safari.text}</div>
    <button class="sh-close">${S.safari.close}</button>`;
  document.body.appendChild(hint);
  hint.querySelector('.sh-close').addEventListener('click', () => {
    localStorage.setItem(HINT_KEY, '1');
    hint.remove();
  });
})();

/* ── INIT ────────────────────────────────────────────────────────────────── */
validateConfigs();
render();

/* re-show a reveal the user hadn't dismissed before the page reloaded — the
   session/loot are already safely in DB, this just recovers the UI moment */
(function resumePendingReveal() {
  const pending = loadPendingReveal();
  if (!pending) return;
  const sess = DB.sessions.find(s => s.id === pending.sessionId);
  if (!sess) { clearPendingReveal(); return; }
  sortieBusy = true;
  document.querySelectorAll('.cmp-btn').forEach(b => b.disabled = true);
  const achs = ACHIEVEMENTS.filter(a => (pending.achievementIds || []).includes(a.id));
  // XP этой вылазки уже в общей сумме: откатываем на её снимок, чтобы
  // квитанция показала «+10», а не «+0», и полоса догнала как в первый раз
  showLoot(sess, achs, totalXP() - (sess.xpAwarded != null ? sess.xpAwarded : 10));
})();
</script>
